<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Miki-Astro Dashboard</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%235eead4'/%3E%3Cpath d='M16 6l2.6 6.2 6.4.5-4.9 4.2 1.5 6.3L16 19.9l-5.6 3.3 1.5-6.3-4.9-4.2 6.4-.5z' fill='%2304121a'/%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<div class="bg-nebula"></div>
<div class="bg-stars"></div>

<!-- ikonkészlet / icon set -------------------------------------------------->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-star" viewBox="0 0 24 24" fill="currentColor">
      <path d="M12 2.6l2.9 6.9 7.4.6-5.6 4.9 1.7 7.3L12 18.4l-6.4 3.9 1.7-7.3L1.7 10l7.4-.6z"/>
    </symbol>
    <symbol id="i-search" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
      <circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/>
    </symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 4v5h-5"/>
    </symbol>
    <symbol id="i-menu" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
      <path d="M4 7h16M4 12h16M4 17h16"/>
    </symbol>
    <symbol id="i-back" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M15 5l-7 7 7 7"/>
    </symbol>
    <symbol id="i-next" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M9 5l7 7-7 7"/>
    </symbol>
    <symbol id="i-close" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
      <path d="M6 6l12 12M18 6L6 18"/>
    </symbol>
    <symbol id="i-play" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4l13 8-13 8z"/></symbol>
    <symbol id="i-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M14 4h6v6"/><path d="M20 4l-9 9"/><path d="M19 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h5"/>
    </symbol>
    <symbol id="i-folder" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 7a1 1 0 0 1 1-1h5l2 2h8a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/>
    </symbol>
    <symbol id="i-info" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
      <circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 7.6v.1"/>
    </symbol>
    <symbol id="i-globe" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
      <circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 0 1 0 18M12 3a15 15 0 0 0 0 18"/>
    </symbol>
    <symbol id="i-sparkle" viewBox="0 0 24 24" fill="currentColor">
      <path d="M12 2l1.9 5.6L19.5 9.5 13.9 11.4 12 17l-1.9-5.6L4.5 9.5l5.6-1.9z"/>
      <path d="M18.5 14l.8 2.3 2.2.8-2.2.8-.8 2.3-.8-2.3-2.2-.8 2.2-.8z"/>
    </symbol>
    <symbol id="i-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M20 6.5L9.5 17 4 11.5"/>
    </symbol>
    <symbol id="i-alert" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
      <circle cx="12" cy="12" r="9"/><path d="M12 7.5v5M12 16.2v.1"/>
    </symbol>
    <symbol id="i-compare" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round">
      <rect x="3" y="5" width="8" height="14" rx="1.5"/><rect x="13" y="5" width="8" height="14" rx="1.5"/>
    </symbol>
    <symbol id="i-panel" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round">
      <rect x="3" y="5" width="18" height="14" rx="2"/><path d="M15 5v14"/>
    </symbol>
    <symbol id="i-telescope" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3.5 13.5l12-7 2.5 4.3-12 7z"/><path d="M11 17l2 4M9 18l-2 3"/><path d="M17.5 4.5l2.6 4.5"/>
    </symbol>
  </defs>
</svg>

<div class="app">

  <!-- oldalsáv / sidebar ------------------------------------------------>
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-mark"><svg><use href="#i-star"/></svg></div>
      <div class="brand-txt">
        <div class="brand-name">Miki-Astro</div>
        <div class="brand-sub">Dashboard</div>
      </div>
      <div class="langs" id="langs">
        <button data-lang="hu">HU</button><button data-lang="en">EN</button>
      </div>
    </div>

    <div class="search">
      <svg><use href="#i-search"/></svg>
      <input id="search" type="search" autocomplete="off" spellcheck="false">
      <kbd>/</kbd>
    </div>

    <div class="chips" id="chips"></div>

    <div class="nav-label" id="navLabel"></div>
    <nav class="objlist" id="objlist"></nav>

    <div class="side-foot" id="sidefoot"></div>
  </aside>

  <div class="scrim" id="scrim"></div>

  <!-- fő terület / main -------------------------------------------------->
  <div class="main">
    <header class="topbar">
      <button class="icon-btn" id="navToggle"><svg><use href="#i-menu"/></svg></button>
      <button class="btn ghost" id="backBtn" style="display:none">
        <svg><use href="#i-back"/></svg> <span data-i18n="back"></span>
      </button>
      <div class="topbar-title" id="crumb"></div>
      <select class="select hide-sm" id="sort"></select>
      <button class="btn primary" id="rescan">
        <svg><use href="#i-refresh"/></svg> <span class="hide-sm" data-i18n="rescan"></span>
      </button>
    </header>

    <main class="content" id="content"></main>
  </div>
</div>

<!-- osztott nézegető / split viewer ---------------------------------------->
<div class="viewer" id="viewer" role="dialog" aria-modal="true">
  <header class="vw-top">
    <div class="vw-titles">
      <div class="vw-title" id="vwTitle"></div>
      <div class="vw-meta" id="vwMeta"></div>
    </div>
    <button class="btn" id="vwCompare"><svg><use href="#i-compare"/></svg>
      <span class="hide-sm" data-i18n="compare"></span></button>
    <button class="btn" id="vwInfo"><svg><use href="#i-panel"/></svg>
      <span class="hide-sm" data-i18n="info"></span></button>
    <button class="btn" id="vwOpen"><svg><use href="#i-open"/></svg>
      <span class="hide-sm" data-i18n="original"></span></button>
    <button class="btn" id="vwReveal"><svg><use href="#i-folder"/></svg>
      <span class="hide-sm" data-i18n="folder"></span></button>
    <button class="btn ghost" id="vwClose"><svg><use href="#i-close"/></svg></button>
  </header>

  <div class="vw-body">
    <div class="vw-stage" id="vwStage">
      <div class="vw-pane on" id="vwMine">
        <div class="vw-media" id="vwMedia"></div>
        <span class="vw-tag" id="vwTagMine"></span>
      </div>
      <div class="vw-pane" id="vwPro">
        <img id="vwProImg" alt="">
        <div class="vw-pro-state" id="vwProState"></div>
        <span class="vw-tag" id="vwTagPro"></span>
      </div>
      <button class="vw-nav prev" id="vwPrev"><svg><use href="#i-back"/></svg></button>
      <button class="vw-nav next" id="vwNext"><svg><use href="#i-next"/></svg></button>
      <div class="vw-hint" id="vwHint"></div>
    </div>

    <aside class="vw-side" id="vwSide"></aside>
  </div>

  <div class="vw-rail" id="vwRail"></div>
</div>

<div class="toasts" id="toasts"></div>

<!-- ezek azért kellenek, hogy a file:// megnyitás is működjön -->
<script src="data/library.js" onerror="void 0"></script>
<script src="data/objects.js" onerror="void 0"></script>
<script src="assets/app.js"></script>
</body>
</html>
